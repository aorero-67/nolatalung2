<script>
/**
 * app.js
 * Phatthalung Tourism — Main Application
 * =========================================
 * Single-page routing via hash-based navigation
 * Views: home | district | category
 * All rendering is dynamic from data.js
 */

'use strict';

/* ─── Router ─────────────────────────────────────────────────────── */
const Router = {
  _current: 'home',
  _currentArgs: [],

  /** Current state */
  state: {
    view: 'home',
    districtId: null,
    categoryId: null,
    placeId: null,
  },

  /** Navigate to a new view */
  navigate(view, districtId = null, categoryId = null, placeId = null) {
    this.state = { view, districtId, categoryId, placeId };
    const hash = this._buildHash(view, districtId, categoryId, placeId);
    history.pushState(this.state, '', hash);
    App.render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  /** Parse hash from URL */
  parseHash() {
    const hash = window.location.hash.replace('#', '') || 'home';
    const parts = hash.split('/');
    this.state.view = parts[0] || 'home';
    this.state.districtId = parts[1] || null;
    this.state.categoryId = parts[2] || null;
    this.state.placeId = parts[3] || null;
  },

  _buildHash(view, districtId, categoryId, placeId) {
    let h = '#' + view;
    if (districtId) h += '/' + districtId;
    if (categoryId) h += '/' + categoryId;
    if (placeId) h += '/' + placeId;
    return h;
  },
};

/* ─── App ─────────────────────────────────────────────────────────── */

/* ─── i18n Language System ──────────────────────────────────────── */
const Lang = {

      transition_desc:'ค้นพบความสวยงามของพัทลุง เมืองแห่งวิถีชีวิตและวัฒนธรรมที่รอให้คุณมาสัมผัสด้วยตัวเอง',
      map_eyebrow:'สำรวจ 11 อำเภอ', map_t1:'แผนที่', map_t2:'พัทลุง',
      map_desc:'แผนที่ pixel ทั้งจังหวัด — แตะหมุดอำเภอเพื่อดูจุดเด่นและสถานที่สำคัญ', map_group_label:'เลือกอำเภอ',
      map_drag:'แตะจุดบนแผนที่เพื่อดูจุดเด่นของแต่ละอำเภอ',
      map_hint:'คลิกเพื่อสำรวจ →', map_loading:'กำลังวาดแผนที่…',
      grid_eyebrow:'11 อำเภอ', grid_t1:'สำรวจ', grid_t2:'พัทลุง',
      grid_desc:'เลือกอำเภอเพื่อค้นหาสถานที่ท่องเที่ยว ที่พัก ร้านอาหาร และกิจกรรมในพื้นที่',
      dist_tag:'อำเภอพัทลุง', hist_eyebrow:'ประวัติและที่มา',
      cat_eyebrow:'เลือกประเภท', cat_t1:'คุณสนใจ', cat_t2:'อะไร?',
      cat_desc:'เลือกสิ่งที่คุณต้องการสำรวจในอำเภอ',
      place_about:'เกี่ยวกับสถานที่', place_info:'ข้อมูลสำคัญ',
      place_loc:'ที่ตั้ง', place_hrs:'เวลาเปิด-ปิด', place_cnt:'ติดต่อ',
      place_map:'ดูบนแผนที่', place_back:'ย้อนกลับ',
      footer_tag:'จากเมืองรองสู่เมืองต้องลอง',
      footer_copy:'© 2025 Nolatalung · มโนราห์ · หนังตะลุง · ทะเลน้อย',
    },
    en: {
      nav_home:'Home', nav_logo_sub:'From Hidden Gem to Must-Visit', lang_btn:'TH',
      intro_cta_plan:'Plan my trip', intro_cta_explore:'Explore Phatthalung',
      hero_prev:'Previous slide', hero_next:'Next slide',
      hero_slide_label:'Phatthalung highlights', map_click_hint:'Click to explore →',
      transition_title:'Start Your Journey',
      transition_desc:'Discover the beauty of Phatthalung — a city of culture, tradition, and breathtaking landscapes waiting to be explored.',
      map_eyebrow:'Explore 11 Districts', map_t1:'Map of', map_t2:'Phatthalung',
      map_desc:'A pixel map of the whole province — tap a district pin for its highlights', map_group_label:'Choose a district',
      map_drag:'Tap a pin on the map to explore each district',
      map_hint:'Click to explore →', map_loading:'Drawing the map…',
      grid_eyebrow:'11 Districts', grid_t1:'Explore', grid_t2:'Phatthalung',
      grid_desc:'Choose a district to find attractions, accommodations, restaurants and local activities.',
      dist_tag:'Phatthalung District', hist_eyebrow:'History & Origin',
      cat_eyebrow:'Choose Category', cat_t1:'What are you', cat_t2:'looking for?',

    try{ localStorage.setItem('nola_lang',this.current); }catch(e){}
    document.documentElement.lang = this.current;

};
function t(k){ return Lang.t(k); }

/* ─── Image Error Handler ───────────────────────────────────────── */
function handleImgError(img) {
  img.classList.add('img-error');
  const parent = img.parentElement;
  if (parent && !parent.querySelector('.no-img-placeholder')) {
    const placeholder = document.createElement('div');
    placeholder.className = 'no-img-placeholder';
    placeholder.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
      <span>No Image</span>
    `;
    parent.style.position = 'relative';
    parent.appendChild(placeholder);
  }
}


const App = {
  /** Mount point */
  root: null,

  init() {
    window.Router = Router;
    this.root = document.getElementById('app');
    if (!this.root) {
      console.error('[App] #app container not found');
      return;
    }

    // Make the document language reflect the stored preference on first load
    document.documentElement.lang = Lang.current;

    // Handle back/forward
    window.addEventListener('popstate', (e) => {
      if (e.state) Router.state = e.state;
      else Router.parseHash();
      this.render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    });

    // Initial parse
    Router.parseHash();
    this.render();
  },

  render() {
    const { view, districtId, categoryId, placeId } = Router.state;
    window.TourismMap?.unmount();
    if (window.updateMusicForDistrict) window.updateMusicForDistrict(districtId);

    // Clean up any existing carousel
    Carousel.destroy();

    // Render based on view
    switch (view) {
      case 'explore':
      case 'map':
      case 'planner': {
        const titles = Lang.is('en') ? {explore:'Explore Phatthalung',map:'Tourism map',planner:'Plan your trip'} : {explore:'สำรวจจุดหมายในพัทลุง',map:'แผนที่ท่องเที่ยวพัทลุง',planner:'วางแผนทริปพัทลุง'};
        const intro = view === 'planner' ? `<div class="planner-intro"><p>${Lang.is('en') ? 'Build a one- to three-day itinerary from guide data. Choose your interests and budget, then arrange the suggested stops.' : 'เลือกวันเดินทาง ความสนใจ และงบ ระบบจะจัดแผน 1–3 วันจากข้อมูลในคู่มือ แล้วคุณปรับจุดแวะได้เอง'}</p><button type="button" class="btn-primary" data-intro-action="plan">${Lang.is('en') ? 'Start planning' : 'เริ่มวางแผน'}</button></div>` : '';
        this.root.innerHTML = `${_navHTML(view)}<section class="catalog-page" id="catalog-page"><p class="catalog-kicker">NOLATALUNG · TRAVEL GUIDE</p><h1>${titles[view]}</h1>${intro}</section>${_footerHTML()}`;
        break;
      }
      case 'district':
        this.root.innerHTML = Views.district(districtId);
        break;
      case 'category':
        this.root.innerHTML = Views.category(districtId, categoryId);
        break;
      case 'place':
        this.root.innerHTML = Views.place(districtId, categoryId, placeId);
        break;
      default:
        this.root.innerHTML = Views.home();
        break;
    }

    // Post-render hooks
    this._postRender(view);
    const heading = this.root.querySelector('h1')?.textContent.trim().replace(/\s+/g, ' ');
    document.title = heading ? `${heading} | NoLaTalung` : 'NoLaTalung · Phatthalung';
    const place = view === 'place' ? PHATTHALUNG_DATA.getPlaces(districtId,categoryId).find(item => String(item.id) === String(placeId)) : null;
    const description = (Lang.is('en') ? place?.descriptionEn || place?.description : place?.description) ||
      (Lang.is('en') ? 'Discover destinations, local food and stays in Phatthalung. Browse the map and plan your trip.' : 'ค้นพบสถานที่ท่องเที่ยว ร้านอาหาร และที่พักในพัทลุง พร้อมแผนที่และตัววางแผนเที่ยว');
    document.querySelector('meta[name="description"]').content = description;
  },

  _postRender(view) {
    // Navbar scroll effect
    Nav.init();

    // Scroll reveal
    ScrollReveal.init();

    // View-specific init
    if (view === 'home' || !view) {
      Carousel.init();
      MagneticCards.init();
      // Pixel district map: inline SVG, no external bundle to wait for
      if (window.PixelMap) window.PixelMap.init();
    } else {
      if (window.PixelMap) window.PixelMap.destroy();
    }
  },
};

/* ─── Views ───────────────────────────────────────────────────────── */
const Views = {
  /**
   * HOME PAGE
   * Hero carousel + District grid
   */
  home() {
    const isEn = Lang.is('en');
    const slides = PHATTHALUNG_DATA.heroSlides.map((s, i) => `
      <div class="hero__slide ${i === 0 ? 'active' : ''}" data-slide="${i}">
        <img
          class="hero__slide-img"
          src="${s.image}"
          alt="${isEn ? s.titleEn : s.title}"
          loading="${i === 0 ? 'eager' : 'lazy'}"
        onerror="handleImgError(this)">
        <div class="hero__slide-overlay"></div>
        <div class="hero__slide-content editorial-hero-content">
          <div class="editorial-hero-tag">${s.district}</div>
          <${'h2'} class="editorial-hero-title">${isEn ? s.titleEn : s.title}</${'h2'}>
          <h2 class="editorial-hero-subtitle">${isEn ? s.title : s.titleEn}</h2>
          <p class="editorial-hero-desc">${isEn ? s.descriptionEn : s.description}</p>
        </div>
      </div>
    `).join('');

    const dots = PHATTHALUNG_DATA.heroSlides.map((_, i) => `
      <button
        class="hero__dot ${i === 0 ? 'active' : ''}"
        aria-label="Slide ${i + 1}"
        data-dot="${i}"
      ></button>
    `).join('');

    const districtCards = PHATTHALUNG_DATA.districts.map((d, i) => `
      <article
        class="district-card reveal reveal--delay-${(i % 4) + 1}"
        role="button"
        tabindex="0"
        aria-label="สำรวจ${d.name}"
        data-district="${d.id}"
      >
        <img
          class="district-card__img"
          src="${d.image}"
          alt="${d.name}"
          loading="lazy"
        / onerror="handleImgError(this)">
        <div class="district-card__glow"></div>
        <div class="district-card__info">
          <div class="district-card__number">
            ${String(i + 1).padStart(2, '0')} / 11
          </div>
          <h3 class="district-card__name">${Lang.is('en')?d.nameEn:d.name}</h3>
          <p class="district-card__name-en">${Lang.is('en')?'':d.nameEn}</p>
          <p class="district-card__tagline">${d.tagline}</p>
        </div>
        <div class="district-card__arrow" aria-hidden="true">→</div>
      </article>
    `).join('');

    return `
      <div class="page">
        ${_navHTML('home')}

        
                <!-- INTRO / FIRST IMPRESSION -->
        <section class="intro-posters" id="introPosters">
          <div class="intro-poster-container intro-poster--hero">
            <img class="intro-poster-img" data-fit="cover" src="thale-noi.jpg" alt="ทะเลน้อย พัทลุง" loading="eager" fetchpriority="high" onerror="handleImgError(this)">
            <div class="intro-hero__shade" aria-hidden="true"></div>
            <div class="intro-hero__body">
              <p class="editorial-eyebrow">PHATTHALUNG · SOUTHERN THAILAND</p>
              <h1 class="editorial-title">${isEn ? 'Discover more<br>in Phatthalung' : 'พัทลุง<br>ไม่ได้มีดีแค่ทางผ่าน'}</h1>
              <p class="editorial-lead">${isEn ? 'Discover lakeside mornings, local flavours and stories worth staying for.' : 'จากเช้าริมทะเลน้อย ถึงรสชาติและเรื่องเล่าของชุมชน ค้นพบพัทลุงในจังหวะของคุณ'}</p>
              <div class="intro-hero__ctas">
                <button type="button" class="btn-primary" data-intro-action="plan">${t('intro_cta_plan')}</button>
                <button type="button" class="btn-ghost" data-intro-action="explore">${t('intro_cta_explore')}</button>
              </div>
              <div class="intro-poster-btn" aria-hidden="true">
                <span class="intro-scroll-cue">&#9660;</span>
              </div>
            </div>
          </div>
        </section>

        <!-- STORY / TRANSITION -->
        <section id="introTransition" class="intro-transition intro-story reveal">
          <div class="intro-story__media">
            <img class="intro-poster-img" data-fit="cover" src="intro0.jpg" alt="NoraTalung key visual" loading="lazy" onerror="handleImgError(this)">
          </div>
          <div class="intro-story__copy">
            <h2>${t('transition_title')}</h2>
            <p>${t('transition_desc')}</p>
            <div class="intro-transition__divider"></div>
          </div>
        </section>

        <!-- HERO CAROUSEL -->
        <section class="hero" id="hero" aria-label="${t('hero_slide_label')}">
          <div class="hero__slides" id="heroSlides">
            ${slides}
          </div>

          <button type="button" class="hero__nav hero__nav--prev" id="heroPrev" aria-label="${t('hero_prev')}">‹</button>
          <button type="button" class="hero__nav hero__nav--next" id="heroNext" aria-label="${t('hero_next')}">›</button>

          <div class="hero__meta">
            <div class="hero__dots" id="heroDots" role="tablist">
              ${dots}
            </div>
            <div class="hero__counter" id="heroCounter" aria-live="polite">1 / ${PHATTHALUNG_DATA.heroSlides.length}</div>
          </div>

          <div class="hero__scroll-hint" aria-hidden="true">
            <div class="hero__scroll-line"></div>
            <span>Scroll</span>
          </div>
        </section>

        <!-- PIXEL DISTRICT MAP -->
        <section class="map-pixel-section" id="districts" aria-labelledby="pixelMapTitle">
          <div class="map-pixel-section__inner">
            <div class="map-pixel-header">
              <span class="section__eyebrow">${t('map_eyebrow')}</span>
              <h2 class="section__title" id="pixelMapTitle">${t('map_t1')}<span>${t('map_t2')}</span></h2>
              <div class="divider-gold"><div class="divider-gold__diamond"></div></div>
              <p class="section__desc">${t('map_desc')}</p>
            </div>
            <div class="pixel-map is-visible" id="pixelMap" role="group" aria-label="${t('map_group_label')}"></div>
            <p class="map-pixel-hint">${t('map_drag')}</p>
          </div>
        </section>

        <!-- DISTRICT GRID -->
        <section class="section districts pattern-bg" id="districtGrid">
          <div class="section__container">
            <div class="section__header reveal">
              <span class="section__eyebrow">${t('grid_eyebrow')}</span>
              <h2 class="section__title">${t('grid_t1')}<span>${t('grid_t2')}</span></h2>
              <div class="divider-gold"><div class="divider-gold__diamond"></div></div>
              <p class="section__desc">
                ${t('grid_desc')}
              </p>
            </div>
            <div class="districts__grid">
              ${districtCards}
            </div>
          </div>
        </section>

        ${_footerHTML()}
      </div>
    `;
  },

  /**
   * DISTRICT PAGE
   * Hero + History + Category selection
   */
  district(districtId) {
    const district = PHATTHALUNG_DATA.getDistrict(districtId);

    if (!district) {
      return `<div class="page">${_navHTML('district')}
        <div class="empty-state">
          ${Lang.is('en') ? 'District not found' : 'ไม่พบข้อมูลอำเภอนี้'}
        </div>
      </div>`;
    }

    const categoryKeys = Object.keys(PHATTHALUNG_DATA.categories);
    const categoryCards = categoryKeys.map((key, i) => {
      const cat = PHATTHALUNG_DATA.categories[key];
      return `
        <article
          class="category-card reveal reveal--delay-${i + 1}"
          role="button"
          tabindex="0"
          aria-label="${Lang.is('en') ? 'View ' : 'ดู'}${Lang.is('en') && cat.nameEn ? cat.nameEn : cat.name}"
          data-district="${districtId}"
          data-category="${cat.id}"
        >
          <img src="${cat.image}" alt="" loading="lazy" class="category-card__bg" onerror="handleImgError(this)">
          <h3 class="category-card__name">${Lang.is('en') && cat.nameEn ? cat.nameEn : cat.name}</h3>
          <p class="category-card__name-en">${Lang.is('en') ? cat.name : (cat.nameEn || '')}</p>
          <p class="category-card__desc">${Lang.is('en') && cat.descriptionEn ? cat.descriptionEn : cat.description}</p>
        </article>
      `;
    }).join('');

    return `
      <div class="page">
        ${_navHTML('district', district)}

        <!-- DISTRICT HERO -->
        <section class="district-hero" aria-label="${Lang.is('en') && district.nameEn ? district.nameEn : district.name}">
          <div class="district-hero__bg">
            <img
              class="district-hero__img"
              src="${district.image}"

function _renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

/* ─── Navigation scroll effect ───────────────────────────────────── */
const Nav = {
  _nav: null,
  _onScroll: null,

  init() {
    this._nav = document.getElementById('mainNav');
    if (!this._nav) return;

    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);

    this._nav.style.transition = 'transform 0.4s ease, background-color 0.4s ease';

    const introSection = document.getElementById('introPosters');
    const introHeight = introSection ? introSection.offsetHeight : 0;

    this._onScroll = () => {
      if (introHeight > 0 && window.scrollY < introHeight) {
        this._nav.style.transform = 'translateY(0)';
        this._nav.classList.remove('scrolled');
      } else {
        this._nav.style.transform = 'translateY(0)';
        this._nav.classList.add('scrolled');
      }
    };

    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll(); // Run once
  },
};

/* ─── Carousel Controller ─────────────────────────────────────────── */
const Carousel = {
  current: 0,
  total: 0,
  timer: null,
  INTERVAL: 5500,

  init() {
    this.slides = document.querySelectorAll('.hero__slide');
    this.dots = document.querySelectorAll('.hero__dot');
    this.total = this.slides.length;
    if (!this.total) return;
    this.current = 0;
    this._updateCounter();

    // Bind nav buttons
    const prev = document.getElementById('heroPrev');
    const next = document.getElementById('heroNext');
    if (prev) prev.onclick = () => this.prev();
    if (next) next.onclick = () => this.next();

    // Bind dots
    this.dots.forEach((dot, i) => {
      dot.onclick = () => this.goTo(i);
    });

    // Swipe support
    this._initSwipe();

    // Auto-play
    this._startTimer();
  },

  _updateCounter() {
    const el = document.getElementById('heroCounter');
    if (el) el.textContent = `${this.current + 1} / ${this.total}`;
  },

  goTo(index) {
    // Deactivate current
    this.slides[this.current]?.classList.remove('active');
    this.dots[this.current]?.classList.remove('active');

    this.current = (index + this.total) % this.total;

    // Activate new
    this.slides[this.current]?.classList.add('active');
    this.dots[this.current]?.classList.add('active');
    this._updateCounter();
  },

  next() {
    this._resetTimer();
    this.goTo(this.current + 1);
  },

  prev() {
    this._resetTimer();
    this.goTo(this.current - 1);
  },

  _startTimer() {
    this.timer = setInterval(() => this.next(), this.INTERVAL);
  },

  _resetTimer() {
    clearInterval(this.timer);
    this._startTimer();
  },

  destroy() {
    clearInterval(this.timer);
    this.timer = null;
  },

  _initSwipe() {
    const hero = document.getElementById('hero');
    if (!hero) return;
    let startX = 0;
    hero.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });
    hero.addEventListener('touchend', (e) => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) this.next();
        else this.prev();
      }
    }, { passive: true });
  },
};

/* ─── Magnetic District Cards ───────────────────────────────────── */
const MagneticCards = {
  _handlers: [],

  init() {
    this.destroy();
    document.querySelectorAll('.district-card').forEach((card) => {
      const onMove = (e) => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.setProperty('--tilt-x', `${y * -7}deg`);
        card.style.setProperty('--tilt-y', `${x * 7}deg`);
        const img = card.querySelector('.district-card__img');
        if (img) img.style.transform = `scale(1.1) translate(${x * 14}px, ${y * 10}px)`;
      };
      const onLeave = () => {
        card.style.setProperty('--tilt-x', '0deg');
        card.style.setProperty('--tilt-y', '0deg');
        const img = card.querySelector('.district-card__img');
        if (img) img.style.transform = '';
      };
      card.addEventListener('mousemove', onMove);
      card.addEventListener('mouseleave', onLeave);
      this._handlers.push({ card, onMove, onLeave });
    });
  },

  destroy() {
    this._handlers.forEach(({ card, onMove, onLeave }) => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
    });
    this._handlers = [];
  },
};

/* ─── Scroll Reveal ───────────────────────────────────────────────── */
const ScrollReveal = {
  observer: null,

  init() {
    if (this.observer) this.observer.disconnect();

    const options = {
      threshold: 0.12,
      rootMargin: '0px 0px -60px 0px',
    };

    this.observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          this.observer.unobserve(entry.target);
        }
      });
    }, options);

    document.querySelectorAll('.reveal').forEach((el) => {
      this.observer.observe(el);
    });
  },
};

/* ─── Event Delegation ────────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  // Intro CTAs (plan / explore)
  const introCta = e.target.closest('[data-intro-action]');
  if (introCta) {
    e.preventDefault();
    const action = introCta.dataset.introAction;
    if (action === 'plan') {
      if (window.SmartTourism) window.SmartTourism.TripPlanner.open();
    } else if (action === 'explore') {
      Router.navigate('explore');
    }
    return;
  }

  // District card click
  const districtCard = e.target.closest('[data-district]');
  const categoryCard = e.target.closest('[data-category]');

  if (categoryCard && districtCard) {
    // Both present = category card with district context
    const districtId = districtCard.dataset.district;
    const categoryId = categoryCard.dataset.category;
    if (districtId && categoryId) {
      Router.navigate('category', districtId, categoryId);
      return;
    }
  }

  if (districtCard && !categoryCard) {
    const districtId = districtCard.dataset.district;
    if (districtId) {
      Router.navigate('district', districtId);
    }
  }
});

// Keyboard accessibility for cards
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    const districtCard = e.target.closest('[data-district]');
    const categoryCard = e.target.closest('[data-category]');
    const placeCard = e.target.closest('.place-card');

    if (placeCard) {
      e.preventDefault();
      placeCard.click();
    } else if (categoryCard && districtCard) {
      e.preventDefault();
      const districtId = districtCard.dataset.district;
      const categoryId = categoryCard.dataset.category;
      if (districtId && categoryId) {
        Router.navigate('category', districtId, categoryId);
      }
    } else if (districtCard) {
      e.preventDefault();
      Router.navigate('district', districtCard.dataset.district);
    }
  }
});

/* ─── Bootstrap ───────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  window.PHATTHALUNG_DATA = PHATTHALUNG_DATA;
  if (window.applyPhatthalungEnhancements) window.applyPhatthalungEnhancements(PHATTHALUNG_DATA);
  App.init();
  if (window.SmartTourism) SmartTourism.init();
});
</script>

    "khao-chaison": encodeURI("กลอนโนราเขาชัยสน.mp3")
  };

  let currentVerseFile = null;

  window.updateMusicForDistrict = function(districtId) {
    const verseFile = districtId ? (districtAudioMap[districtId] || defaultHomeVerse) : defaultHomeVerse;
    if (verseFile !== currentVerseFile) {
      currentVerseFile = verseFile;
      if (verseFile) {
        verseAudio.src = verseFile;
        verseAudio.currentTime = 0;
        if (!bgAudio.paused) {
          verseAudio.play().catch(()=>{});
        }
      } else {
        verseAudio.pause();
        verseAudio.currentTime = 0;
        verseAudio.removeAttribute('src');
      }
    }
  };

  function setPlaying() {
    btn.classList.remove('paused');
    btn.setAttribute('aria-pressed', 'true');
    btn.title = 'ปิดเพลง';
  }
  function setPaused() {
    btn.classList.add('paused');
    btn.setAttribute('aria-pressed', 'false');
    btn.title = 'เปิดเพลง';
  }

  setPaused();

  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (bgAudio.paused) {
      bgAudio.play().then(() => {
        setPlaying();
        if (currentVerseFile && verseAudio.src) verseAudio.play().catch(()=>{});
      }).catch(() => {});
    } else {
      bgAudio.pause();
      verseAudio.pause();
      setPaused();
    }
  });
})();
</script>
