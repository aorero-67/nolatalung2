<style id="music-btn-style">
#musicToggleBtn {
  position: fixed;
  top: 72px;
  left: 16px;
  z-index: 9999;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, #b5830a, #e8a922);
  box-shadow: 0 4px 18px rgba(181,131,10,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s;
  outline: none;
}
#musicToggleBtn:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 24px rgba(181,131,10,0.6);
}
#musicToggleBtn svg {
  width: 24px;
  height: 24px;
  fill: #fff;
}
#musicToggleBtn .music-waves {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 20px;
}
#musicToggleBtn .music-waves span {
  display: block;
  width: 4px;
  background: #fff;
  border-radius: 2px;
  animation: wave 0.8s ease-in-out infinite alternate;
}
#musicToggleBtn .music-waves span:nth-child(1) { height: 8px; animation-delay: 0s; }
#musicToggleBtn .music-waves span:nth-child(2) { height: 16px; animation-delay: 0.15s; }
#musicToggleBtn .music-waves span:nth-child(3) { height: 12px; animation-delay: 0.3s; }
#musicToggleBtn .music-waves span:nth-child(4) { height: 20px; animation-delay: 0.45s; }
#musicToggleBtn .music-waves span:nth-child(5) { height: 10px; animation-delay: 0.6s; }
#musicToggleBtn.paused .music-waves span { animation: none; height: 6px; }
@keyframes wave {
  from { transform: scaleY(0.4); }
  to   { transform: scaleY(1); }
}
</style>

/**
 * app.js
 * Phatthalung Tourism — Main Application
 * =========================================
 * Single-page routing via hash-based navigation
 * Views: home | district | category
 * All rendering is dynamic from data.js
 */

'use strict';

/* ─── Router ─────────────────────────────────────────────────────── */
const Router = {
  _current: 'home',
  _currentArgs: [],

  /** Current state */
  state: {
    view: 'home',
    districtId: null,
    categoryId: null,
    placeId: null,
  },

  /** Navigate to a new view */
  navigate(view, districtId = null, categoryId = null, placeId = null) {
    this.state = { view, districtId, categoryId, placeId };
    const hash = this._buildHash(view, districtId, categoryId, placeId);
    history.pushState(this.state, '', hash);
    App.render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  /** Parse hash from URL */
  parseHash() {
    const hash = window.location.hash.replace('#', '') || 'home';
    const parts = hash.split('/');
    this.state.view = parts[0] || 'home';
    this.state.districtId = parts[1] || null;
    this.state.categoryId = parts[2] || null;
    this.state.placeId = parts[3] || null;
  },

  _buildHash(view, districtId, categoryId, placeId) {
    let h = '#' + view;
    if (districtId) h += '/' + districtId;
    if (categoryId) h += '/' + categoryId;
    if (placeId) h += '/' + placeId;
    return h;
  },
};

/* ─── App ─────────────────────────────────────────────────────────── */

window.IntroPosters = {
  init() {
    const section = document.getElementById('introPosters');
    if (!section || typeof anime === 'undefined') return;

    const containers = section.querySelectorAll('.intro-poster-container');
    if (!containers.length) return;

    const stateMap = new Map();

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const img = entry.target.querySelector('.intro-poster-img');
        const btn = entry.target.querySelector('.intro-poster-btn');
        if (!img) return;

        const isVisible = entry.isIntersecting;
        const currentState = stateMap.get(entry.target);

        if (isVisible && currentState !== 'visible') {
          stateMap.set(entry.target, 'visible');
          anime.remove(img);
          if (btn) anime.remove(btn);

          // Animate IN
          anime.timeline({
            easing: "easeOutExpo"
          })
          .add({
            targets: img,
            scale: [1.1, 1],
            opacity: [0, 1],
            filter: ['blur(15px)', 'blur(0px)'],
            duration: 2000
          })
          .add({
            targets: btn,
            translateY: [40, 0],
            opacity: [0, 0.9],
            duration: 1000
          }, "-=1500");

        } else if (!isVisible && currentState === 'visible') {
          stateMap.set(entry.target, 'hidden');
          anime.remove(img);
          if (btn) anime.remove(btn);

          // Animate OUT
          anime({
            targets: img,
            scale: 1.1,
            opacity: 0,
            filter: 'blur(15px)',
            duration: 800,
            easing: "easeOutQuad"
          });
          if (btn) {
             anime({
               targets: btn,
               translateY: 40,
               opacity: 0,
               duration: 600,
               easing: "easeOutQuad"
             });
          }
        }
      });
    }, { threshold: 0.1 });

    containers.forEach(el => {
      const img = el.querySelector('.intro-poster-img');
      const btn = el.querySelector('.intro-poster-btn');
      if (img) { 
        img.style.opacity = '0'; 
        img.style.transform = 'scale(1.1)';
        img.style.filter = 'blur(15px)';
        // Revert to contain so the poster is fully visible
        img.style.objectFit = 'contain';
      }
      if (btn) { 
        btn.style.opacity = '0'; 
        btn.style.transform = 'translateY(40px)'; 
      }
      observer.observe(el);
    });
  }
};

/* ─── Image Error Handler ───────────────────────────────────────── */
function handleImgError(img) {
  img.classList.add('img-error');
  const parent = img.parentElement;
  if (parent && !parent.querySelector('.no-img-placeholder')) {
    const placeholder = document.createElement('div');
    placeholder.className = 'no-img-placeholder';
    placeholder.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
      <span>No Image</span>
    `;
    parent.style.position = 'relative';
    parent.appendChild(placeholder);
  }
}


const App = {
  /** Mount point */
  root: null,

  init() {
    window.Router = Router;
    this.root = document.getElementById('app');
    if (!this.root) {
      console.error('[App] #app container not found');
      return;
    }

    // Handle back/forward
    window.addEventListener('popstate', (e) => {
      if (e.state) Router.state = e.state;
      else Router.parseHash();
      this.render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    });

    // Initial parse
    Router.parseHash();
    this.render();
  },

  render() {
    const { view, districtId, categoryId, placeId } = Router.state;

    // Clean up any existing carousel
    Carousel.destroy();

    // Render based on view
    switch (view) {
      case 'district':
        this.root.innerHTML = Views.district(districtId);
        break;
      case 'category':
        this.root.innerHTML = Views.category(districtId, categoryId);
        break;
      case 'place':
        this.root.innerHTML = Views.place(districtId, categoryId, placeId);
        break;
      default:
        this.root.innerHTML = Views.home();
        break;
    }

    // Post-render hooks
    this._postRender(view);
  },

  _postRender(view) {
    // Navbar scroll effect
    Nav.init();

    // Scroll reveal
    ScrollReveal.init();

    // View-specific init
    if (view === 'home' || !view) {
      if (window.IntroPosters) IntroPosters.init();
      Carousel.init();
      MagneticCards.init();
      if (window.Map3D) window.Map3D.init();
    } else {
      if (window.Map3D) window.Map3D.destroy();
    }
  },
};

function _renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

/* ─── Navigation scroll effect ───────────────────────────────────── */
const Nav = {
  _nav: null,
  _onScroll: null,

  init() {
    this._nav = document.getElementById('mainNav');
    if (!this._nav) return;

    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);

    this._nav.style.transition = 'transform 0.4s ease, background-color 0.4s ease';

    const introSection = document.getElementById('introPosters');
    const introHeight = introSection ? introSection.offsetHeight : 0;

    this._onScroll = () => {
      if (introHeight > 0 && window.scrollY < introHeight) {
        this._nav.style.transform = 'translateY(-100%)';
        this._nav.classList.remove('scrolled');
      } else {
        this._nav.style.transform = 'translateY(0)';
        this._nav.classList.add('scrolled');
      }
    };

    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll(); // Run once
  },
};

/* ─── Carousel Controller ─────────────────────────────────────────── */
const Carousel = {
  current: 0,
  total: 0,
  timer: null,
  INTERVAL: 5500,

  init() {
    this.slides = document.querySelectorAll('.hero__slide');
    this.dots = document.querySelectorAll('.hero__dot');
    this.total = this.slides.length;
    if (!this.total) return;

    // Bind nav buttons
    const prev = document.getElementById('heroPrev');
    const next = document.getElementById('heroNext');
    if (prev) prev.onclick = () => this.prev();
    if (next) next.onclick = () => this.next();

    // Bind dots
    this.dots.forEach((dot, i) => {
      dot.onclick = () => this.goTo(i);
    });

    // Swipe support
    this._initSwipe();

    // Auto-play
    this._startTimer();
  },

  goTo(index) {
    // Deactivate current
    this.slides[this.current]?.classList.remove('active');
    this.dots[this.current]?.classList.remove('active');

    this.current = (index + this.total) % this.total;

    // Activate new
    this.slides[this.current]?.classList.add('active');
    this.dots[this.current]?.classList.add('active');
  },

  next() {
    this._resetTimer();
    this.goTo(this.current + 1);
  },

  prev() {
    this._resetTimer();
    this.goTo(this.current - 1);
  },

  _startTimer() {
    this.timer = setInterval(() => this.next(), this.INTERVAL);
  },

  _resetTimer() {
    clearInterval(this.timer);
    this._startTimer();
  },

  destroy() {
    clearInterval(this.timer);
    this.timer = null;
  },

  _initSwipe() {
    const hero = document.getElementById('hero');
    if (!hero) return;
    let startX = 0;
    hero.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });
    hero.addEventListener('touchend', (e) => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) this.next();
        else this.prev();
      }
    }, { passive: true });
  },
};

/* ─── Magnetic District Cards ───────────────────────────────────── */
const MagneticCards = {
  _handlers: [],

  init() {
    this.destroy();
    document.querySelectorAll('.district-card').forEach((card) => {
      const onMove = (e) => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.setProperty('--tilt-x', `${y * -7}deg`);
        card.style.setProperty('--tilt-y', `${x * 7}deg`);
        const img = card.querySelector('.district-card__img');
        if (img) img.style.transform = `scale(1.1) translate(${x * 14}px, ${y * 10}px)`;
      };
      const onLeave = () => {
        card.style.setProperty('--tilt-x', '0deg');
        card.style.setProperty('--tilt-y', '0deg');
        const img = card.querySelector('.district-card__img');
        if (img) img.style.transform = '';
      };
      card.addEventListener('mousemove', onMove);
      card.addEventListener('mouseleave', onLeave);
      this._handlers.push({ card, onMove, onLeave });
    });
  },

  destroy() {
    this._handlers.forEach(({ card, onMove, onLeave }) => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
    });
    this._handlers = [];
  },
};

/* ─── Scroll Reveal ───────────────────────────────────────────────── */
const ScrollReveal = {
  observer: null,

  init() {
    if (this.observer) this.observer.disconnect();

    const options = {
      threshold: 0.12,
      rootMargin: '0px 0px -60px 0px',
    };

    this.observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          this.observer.unobserve(entry.target);
        }
      });
    }, options);

    document.querySelectorAll('.reveal').forEach((el) => {
      this.observer.observe(el);
    });
  },
};

  if (categoryCard && districtCard) {
    // Both present = category card with district context
    const districtId = districtCard.dataset.district;
    const categoryId = categoryCard.dataset.category;
    if (districtId && categoryId) {
      Router.navigate('category', districtId, categoryId);
      return;
    }
  }

  if (districtCard && !categoryCard) {
    const districtId = districtCard.dataset.district;
    if (districtId) {
      Router.navigate('district', districtId);
    }
  }
});

// Keyboard accessibility for cards
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    const districtCard = e.target.closest('[data-district]');
    const categoryCard = e.target.closest('[data-category]');

    if (categoryCard && districtCard) {
      e.preventDefault();
      const districtId = districtCard.dataset.district;
      const categoryId = categoryCard.dataset.category;
      if (districtId && categoryId) {
        Router.navigate('category', districtId, categoryId);
      }
    } else if (districtCard) {
      e.preventDefault();
      Router.navigate('district', districtCard.dataset.district);
    }
  }
});

<script>
(function() {
  const btn = document.getElementById('musicToggleBtn');
  const audio = document.getElementById('bgMusic');
  audio.volume = 0.5;

  function setPlaying() {
    btn.classList.remove('paused');
    btn.title = 'ปิดเพลง';
  }
  function setPaused() {
    btn.classList.add('paused');
    btn.title = 'เปิดเพลง';
  }

  // Try autoplay immediately
  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.then(() => {
      setPlaying();
    }).catch(() => {
      // Blocked by browser - wait for first user interaction
      setPaused();
      const unlock = () => {
        audio.play().then(() => {
          setPlaying();
          document.removeEventListener('click', unlock);
          document.removeEventListener('touchstart', unlock);
          document.removeEventListener('keydown', unlock);
        }).catch(() => {});
      };
      document.addEventListener('click', unlock, { once: true });
      document.addEventListener('touchstart', unlock, { once: true });
      document.addEventListener('keydown', unlock, { once: true });
    });
  }

  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (audio.paused) {
      audio.play().then(() => setPlaying()).catch(() => {});
    } else {
      audio.pause();
      setPaused();
    }
  });
})();
</script>
